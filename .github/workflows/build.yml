
name: Build hyperGame X APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q hyperGame-X-Android-Starter.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/hyperGame-X :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperGame-X-APK
          path: extracted/hyperGame-X/app/build/outputs/apk/debug/app-debug.apk
          
